services:
  postgres:
    image: postgres:16
    container_name: drukalert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drukalert
      POSTGRES_PASSWORD: drukalert
      POSTGRES_DB: drukalert
    ports:
      # 5433 on the host avoids the PostgreSQL service already bound to 5432.
      - "5433:5432"
    volumes:
      - drukalert_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drukalert -d drukalert"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  drukalert_pg:
